<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Azure MySQL Inventory</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: grid;
            gap: 10px;
            margin-bottom: 30px;
        }

        input,
        button {
            padding: 12px;
            font-size: 16px;
        }

        button {
            background: #0078d4;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Azure MySQL Inventory</h1>

    <form action="/add" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Product name"
            required
        >

        <input
            type="number"
            name="quantity"
            placeholder="Quantity"
            required
        >

        <input
            type="number"
            step="0.01"
            name="price"
            placeholder="Price"
            required
        >

        <button type="submit">
            Add Product
        </button>

    </form>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody>

        {% for product in products %}

            <tr>

                <td>{{ product.id }}</td>

                <td>{{ product.name }}</td>

                <td>{{ product.quantity }}</td>

                <td>${{ product.price }}</td>

                <td>
                    <a href="/delete/{{ product.id }}">
                        Delete
                    </a>
                </td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>

</html>
